apiVersion: apps/v1
kind: Deployment
metadata:
  name: match-function
  namespace: open-match
spec:
  replicas: 1
  selector:
    matchLabels:
      app: match-function
  template:
    metadata:
      labels:
        app: match-function
    spec:
      containers:
      - name: match-function
        image: match-function:v2
        imagePullPolicy: Never
        ports:
        - containerPort: 50502
---
apiVersion: v1
kind: Service
metadata:
  name: match-function
  namespace: open-match
spec:
  selector:
    app: match-function
  ports:
  - port: 50502
    targetPort: 50502
